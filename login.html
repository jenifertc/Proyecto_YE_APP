<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Inicio de sesión de YE Estudio de Uñas">

    <title>Iniciar sesión | YE Estudio de Uñas</title>

    <link rel="stylesheet" href="styles/stylel.css">

</head>


<body>

    <!-- ===== ENCABEZADO ===== -->

    <header class="login-header">

        <a href="index.html">

            <img
                src="assets/images/logo.png"
                alt="Logo YE Estudio de Uñas"
                class="login-logo"
            >

        </a>

    </header>


    <!-- ===== CONTENIDO PRINCIPAL ===== -->

    <main class="login-main">

        <section
            class="login-container"
            aria-labelledby="titulo-login"
        >

            <div class="login-card">

                <h1 id="titulo-login">
                    Iniciar sesión
                </h1>

                <p class="login-subtitle">
                    Bienvenido a YE Estudio de Uñas
                </p>


                <!-- ===== FORMULARIO ===== -->

                <form action="#" method="POST">

                    <fieldset>

                        <legend>
                            Acceso a tu cuenta
                        </legend>


                        <!-- CORREO -->

                        <div class="form-group">

                            <label for="correo">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                placeholder="Ingresa tu correo"
                                required
                            >

                        </div>


                        <!-- CONTRASEÑA -->

                        <div class="form-group">

                            <label for="password">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                        </div>


                        <!-- RECORDAR -->

                        <div class="remember">

                            <input
                                type="checkbox"
                                id="recordar"
                                name="recordar"
                            >

                            <label for="recordar">
                                Recordarme
                            </label>

                        </div>


                        <!-- BOTÓN -->

                        <button
                            type="submit"
                            class="btn-login"
                        >
                            Ingresar
                        </button>

                    </fieldset>

                </form>


                <!-- ===== OPCIONES ===== -->

                <p class="forgot-password">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </p>


                <p class="register">

                    ¿No tienes una cuenta?

                    <a href="registro.html">
                        Regístrate aquí
                    </a>

                </p>


                <!-- VOLVER AL INICIO -->

                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Volver al inicio
                </a>

            </div>

        </section>

    </main>


    <!-- ===== PIE DE PÁGINA ===== -->

    <footer class="login-footer">

        <p>
            &copy; 2026 YE Estudio de Uñas.
            Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
