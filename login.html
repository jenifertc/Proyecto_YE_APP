<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión Ye App</title>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="assets/images/logo.png" alt="Logo Ye Estudio" width="50" height="50">
        </a>
    </header>

    <main>
        <section aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar sesión</h1>
            
            <form action="#" method="POST"-->
                <fieldset>
                     <legend>Inicio de sesión</legend>

                     <div>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required> <br><br>
                     </div>

                     <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required> <br><br>
                     </div>

                     <div>
                        <input type="checkbox" id="recordar" name="recordar">
                        <label for="recordar">Recordarme</label>
                     </div>
                </fieldset>

                <button type="submit">Ingresar</button>
            </form>

            <p><a href="#>¿Olvidaste tu contraseña?</a></p>
            <p> ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                              
               
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ye Estudio de Uñas. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
